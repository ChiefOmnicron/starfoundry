[package]
name = "starfoundry-mapping"
authors.workspace = true
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
dotenvy = "0.15.7"
pathfinding = "4.15.0"
prometheus-client = "0.24.1"
reqwest = { version = "0.13.4", features = ["json", "query", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0-alpha.1", features = ["chrono", "runtime-tokio", "postgres", "uuid", "json", "sqlx-toml"] }
starfoundry_lib-types = { path = "../gp_lib-types" }
starfoundry-eve-gateway = { path = "../eve-gateway" }
starfoundry-gateway = { path = "../gateway" }
thiserror = "2.0.20"
tokio = { version = "1.48.0", features = ["full"] }
tower = "0.5.3"
tracing = "0.1.43"
tracing-subscriber =  { version = "0.3.22", features = ["env-filter", "json"] }
url = "2.5.8"
utoipa = { version = "5.5.0", features = ["uuid", "yaml"] }
utoipa-axum = "0.2.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }

[lints]
workspace = true

[[bin]]
name = "starfoundry-mapping_bin-server"
path = "src/bin/server.rs"
